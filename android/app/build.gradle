apply plugin: 'com.android.application'

// Release signing config - read from a properties file OUTSIDE this project
// entirely (never inside the repo, even gitignored - a project-local file was
// tried first and this workspace's own file-change monitoring surfaced its
// contents unintentionally, so nothing sensitive lives under the project root
// anymore). Never read/logged by this build script beyond the property lookups
// below; Gradle loads the file's actual values directly into memory.
def signingPropertiesFile = new File(System.getProperty("user.home"), "keys/playcydi-signing.properties")
def signingProperties = new Properties()
if (signingPropertiesFile.exists()) {
    signingProperties.load(new FileInputStream(signingPropertiesFile))
}

// Fails fast, with a clear message, only when a release-type task is actually
// being run - evaluated once the full task graph is known, so `assembleDebug`/
// tests/etc. are never affected by this file's absence. A configuration-time
// check inside buildTypes.release{} would fire for every build type, including
// debug, since Gradle configures the whole variant model regardless of which
// task was requested.
gradle.taskGraph.whenReady { taskGraph ->
    def buildingRelease = taskGraph.allTasks.any { it.name.toLowerCase().contains("release") }
    if (!buildingRelease) return

    if (!signingPropertiesFile.exists()) {
        throw new GradleException(
            "Release signing properties not found at ${signingPropertiesFile}. " +
            "Create that file (storeFile, storePassword, keyAlias, keyPassword) before " +
            "building a release APK/AAB - see android/app/build.gradle for the expected keys."
        )
    }
    // Validates presence only - never logs/echoes any value from the file, even
    // the (non-secret) storeFile path, to stay within "never inspect this file".
    ["storeFile", "storePassword", "keyAlias", "keyPassword"].each { key ->
        def value = signingProperties[key]
        if (value == null || value.toString().trim().isEmpty()) {
            throw new GradleException(
                "Release signing properties file at ${signingPropertiesFile} is missing (or has a blank) " +
                "'${key}' value. Required keys: storeFile, storePassword, keyAlias, keyPassword."
            )
        }
    }
    if (!new File(signingProperties['storeFile'].toString()).exists()) {
        throw new GradleException(
            "The keystore file referenced by 'storeFile' in ${signingPropertiesFile} does not exist on disk. " +
            "Double-check the path (forward slashes, even on Windows)."
        )
    }
}

android {
    namespace = "com.playcydi.cydi"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.playcydi.cydi"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionName USED to mirror APP_VERSION in src/app/constants.ts by hand. Since
        // 0.53.0 it no longer has to: on Android, analytics (appVersion/appVersionCode),
        // the install-referrer first_open check and the Settings "Version X" line all
        // read THIS package's versionName/versionCode at runtime (App.getInfo(), see
        // src/services/nativeAppInfo.ts). APP_VERSION is now the web release number only
        // and follows the web's own cadence.
        //
        // versionCode must strictly increase on every APK/AAB actually distributed to a
        // device or the Play Store (side-load, internal testing, or production) - Android
        // silently refuses to install an update whose versionCode isn't higher than what's
        // already on the device, and neither the OS nor the installer surfaces an error:
        // MIUI's package installer just showed "Open" for the already-installed version
        // and nothing was overwritten. Reusing the same versionCode across debug builds
        // during development, then forgetting to bump it before the next real distribution,
        // is what caused that.
        // 6 shipped to Play internal testing (release/v6-internal-test); 7 was the
        // local ContentRepository test build; 8 shipped with broken assets
        // (Dropbox EBUSY corrupted that cap sync); 9 = fixed dynamic-content test
        // build; 10 = same build with the WebView DevTools socket enabled
        // (CYDI_TEST_WEBVIEW_DEBUG) so the locked MIUI device can be driven for
        // E2E. All 0.27.2; versionCode bumps only because MIUI silently refuses
        // same-versionCode updates. 7-10 were local/DevTools test builds (never
        // for Play). 11 = first clean production candidate: no DevTools, no API
        // override, signed with the Play keystore, for Closed Testing. 12 = next
        // release candidate, APP_VERSION bumped to 0.28.0 - adds Dark Mode, Rate
        // CYDI (Settings), first-time drawing-controls tutorial, and the Shop pen
        // price UI tweak; no DevTools, signed with the Play keystore. 13 = 0.29.0,
        // the first rewarded-ads-capable build: AD_FLAGS master + rewarded are on and
        // the production rewarded ad unit resolves, but the fail-closed remote kill
        // switch has no published config, so it ships dark. Bumped off 12 rather than
        // reusing it because a signed 0.28.0 AAB with versionCode 12 already exists
        // locally and may already be on Play, which would permanently block re-upload.
        // 13 shipped to Production and the remote switch is now published as
        // { enabled: true }, so rewarded ads are live. 14 = 0.30.0: removes the
        // math-quiz route to the ×2 coin reward from user-facing builds (watching a
        // rewarded ad is now the only way to earn it, and a capped daily chest double is
        // charged only once an ad has actually granted it), plus the matching privacy
        // policy wording. 15 = next Play release: the Android Sharesheet for every
        // share point (@capacitor/share) with generic shares pointing at the Play
        // listing, the website's "Get the Android App" CTA, and the App-vs-web
        // platform split in analytics. NOTE: the MIUI test device now carries a
        // debug-signed verification build at versionCode 16 (used to verify the
        // Sharesheet on real hardware), so a future DEVICE test build needs 17+.
        // Play's highest upload was 14 at that point, so 15 was the next release,
        // shipping as 0.31.0 (the public release before it was 0.30.0 / versionCode
        // 14). 15 then went live on Production on 12 Aug 2026.
        // 17 = 0.33.0, the unified release: rewarded-offer nudges (concrete x2
        // amounts, one-time explainer, 3-skip reminder), the reworked result screen
        // (actions above the comparison canvas, usable during the x2 offer), and
        // Create Challenge discovery. 17 rather than 16 because the MIUI device
        // already carries the debug vc16 noted above - 17 cleared both Play (<=15)
        // and the device in one bump, for the QA build and the AAB alike.
        //
        // 17 = 0.33.0 went LIVE on Google Play Production (released 16 Aug 2026, all
        // 177 countries) - Play's highest upload to date.
        // 18 = 0.34.0: the Android bottom safe-area fix (the navigation bar no longer
        // covers the last button on a screen under edge-to-edge) and the periodic 3x
        // rewarded bonus (every 7th completed round offers ×3 instead of ×2).
        //
        // 18 = 0.34.0, submitted to Play Production on 17 Aug 2026 (full rollout,
        // 177 countries).
        // 19 = 0.34.1, a fixes-only follow-up: touch scrolling on the result screen
        // (the read-only comparison canvas no longer swallows touch gestures) and a
        // short notice while a Play flexible update downloads / is ready to install.
        //
        // 19 = 0.34.1 went LIVE on Google Play (Play's highest upload to date).
        // 20 = 0.35.0, the contextual onboarding release: the "Start here" spotlight
        // replaces the 5-step intro modal, an inline first-round coach (preview
        // countdown, "Draw it", "Tap Done", "Tap Next") replaces the blocking drawing
        // modal, the improvement tip moves below the continue actions, and the result
        // screen is compacted on phones so Next Shape clears the fold. 20 was first
        // used for the debug device-test builds of this same work, which is why the
        // MIUI test device carries a debug-signed 20 - it cannot take this release
        // build over it (same code, and a different signature); wipe the debug build
        // first if that device ever needs the release one.
        //
        //
        // 20 = 0.35.0 went LIVE on Google Play Production on 19 Aug 2026 (full
        // rollout, 177 countries), built from the pre-fix tree.
        // 21 = 0.35.1, a fixes-only follow-up to that release: WCAG AA contrast in
        // the colour tokens, the home screen's Shape Challenge card carrying real
        // shapes, the friend-challenge first-run flow (walkthrough before the
        // preview, longer preview, "Tap Done" coach, Back to home), and the loading
        // state that keeps the onboarding spotlight off a resolving challenge link.
        // 0.35.0 could not carry them: its code was already published, and Play
        // permanently rejects a re-used versionCode.
        //
        // 22: Stage 6 release-candidate TEST build for Play Together, installed
        // on the Mi 8 for real-device QA and never uploaded to Play. It pointed
        // at a temporary staging tunnel via VITE_API_ORIGIN_OVERRIDE, so it must
        // never be confused with a shippable artifact.
        //
        // 23: shipped to Play as 0.38.0 (Play Together). Live.
        //
        // 24: release-candidate TEST build for the next version - the mode
        // selector, 2 Players and Social Points/Rank. DEBUG-signed on purpose:
        // the Mi 8 already carries a debug build, and a release-signed APK over
        // it would be refused for a signature mismatch, which on a test device
        // means uninstalling and losing the very local state (coins, tutorial
        // flags, Social Points) the QA is meant to exercise. Never uploaded to
        // Play; the shipping build takes the next code after it.
        //
        // 24, 25: release candidates for this version, debug-signed and
        // installed only on the Mi 8 for QA. rc1 -> rc2 fixed the compact badge
        // announcing a promotion about 400ms before the progress card did.
        //
        // 26: uploaded to the Play production draft for 0.39.0, then superseded
        // before submission by the multiplayer canvas / leave / resume fixes.
        // A used code can never be re-uploaded, so 27 is what ships.
        //
        // 27: test build with the multiplayer canvas / leave / resume fixes.
        //
        // 28: test build with the coach-mark layout fix for the first-stroke
        // jump.
        //
        // 26: 0.39.0, live since 23 Aug - the mode selector, 2 Players and
        // Social Points/Rank. It went out before the multiplayer drawing fixes
        // were found, which is why those became a patch rather than part of it.
        //
        // 27, 28: debug test builds for that patch; never uploaded.
        //
        // 29: 0.39.1, the patch itself.
        //
        // 30: 0.40.0, the Android visual refresh - Home, Classic Show/Draw,
        // Classic Result, 2 Players Result and Multiplayer Result on one native
        // presentation layer, plus the solid-target-in-preview convention.
        // Play Console bundle explorer on 1 Sep 2026 listed 13 uploads across
        // all tracks (11-15, 17-21, 23, 26, 29); 29 was the highest, so 30 is
        // the next free code.
        //
        // DEPLOYMENT COUPLING: this client reads `gameSerial` from the room
        // snapshot, which only the Worker in this same commit sends. The Worker
        // and the web build must go out together or a rematch stops earning
        // Social Points. See worker/roomDO.ts handleStart.
        //
        // 31-40: NEVER UPLOADED. Local/QA builds only, while the app sat on 30 for
        // three weeks of web-only releases (0.41.0-0.48.3). 40 is the one that
        // matters: it is the debug-signed build still sitting on the MIUI test
        // device, so any code the device must accept has to clear 40, not 30.
        //
        // 41 = 0.48.4, the first Android release since 0.40.0. Play's highest
        // upload is 30 (bundle explorer, 22 Sep 2026: 14 bundles, 30 Active), so
        // 31 would have sufficed for Play alone - 41 is chosen to clear the test
        // device in the same bump, exactly as 17 did over the stale debug 16.
        // Almost nothing here is user-visible: the 0.41-0.48 work was website and
        // SEO. What Android actually gains is honest telemetry - rewarded no-fill
        // told apart from a broken SDK, and real appVersion/appBuild on every
        // event instead of "unknown".
        //
        // DEPLOYMENT ORDER: the client now emits reason "no_fill", which the
        // Worker validates against AD_FAILURE_REASONS and DROPS the whole event
        // if it does not know. The Worker must be deployed before this build
        // reaches users, or the very failures it exists to measure vanish.
        //
        // 42 is 0.49.2: the rewarded ad is warmed at the preview -> drawing
        // transition instead of at the offer's own mount, and practice rounds are
        // excluded because one can never reach the offer. Measured at 2.97s to
        // load on the Mi 8 - inside the 8s timeout, but far longer than a player
        // waits at the "Watch Ad" button, which is the whole point.
        //
        // The versionName skips 0.48.4 -> 0.49.2 rather than stepping: 0.49.0 and
        // 0.49.1 were website-only releases, so Android never shipped them. It
        // mirrors APP_VERSION as always, and this release is deliberately NOT
        // reusing 0.49.1 - vc41 and vc42 differ, so two artifacts under one
        // appVersion would make the preload's effect unmeasurable in the very
        // analytics it exists to move.
        //
        // 43 is 0.50.0, and it supersedes 42: the 0.49.2 AAB was built locally but never
        // uploaded to Play and never installed on a device, so nothing was distributed
        // under 42. It gets its own code anyway rather than being reused, because the two
        // artifacts differ - 43 adds Play Install Referrer attribution on top of the
        // rewarded preload - and a versionCode that has meant two different builds is a
        // trap the history above already records the cost of.
        //
        // What 43 adds: install attribution from Google Play (install_attributed) and a
        // first-launch approximation (first_open), Android-only, plus the first native
        // plugin this app has ever had. INSTALL_REFERRER_NOTES.md is the specification -
        // read it before changing any of it, especially the part about first_open NOT
        // being an exact install counter.
        //
        // DEPLOYMENT ORDER, again: the Worker validates event names AND the installAge
        // bucket strings, and drops the whole event when it does not know one. The Worker
        // must be deployed before this build reaches users.
        //
        // 44 is 0.51.0, and it is a COST release: it changes how the client talks to the
        // backend, not what the game does. On 23 Sep 2026 CYDI exhausted two account-wide
        // Cloudflare Free-plan Durable Object limits in a day - 106.69k requests and
        // 120.99k rows written against 100k caps - and the site went to 429. Server-side
        // work (33ae4a1) cut rows written by ~89% but could not touch DO REQUESTS, because
        // both sources of those are in the client:
        //   - analytics posted one HTTP request per event (~50k/day). It now queues and
        //     posts batches of up to 10 to /api/analytics/events.
        //   - Play Together sent a timestamped clock ping every 10s purely to keep its
        //     offset fresh, and every one woke RoomDO (~60% of its requests). Clock sync
        //     is now a short burst at connect plus a resync after a stale resume, and
        //     staying connected is proved by a fixed frame the Cloudflare runtime answers
        //     without waking the object at all.
        //
        // DEPLOYMENT ORDER, and it is stricter than usual this time: /api/analytics/events
        // does not exist on the deployed Worker yet. A build that reaches users before the
        // Worker ships would post every batch into a 404 and lose ALL its analytics - not
        // degrade, lose. Deploy the Worker first, confirm the batch endpoint answers 200,
        // and only then distribute this.
        //
        // 45 is 0.51.0 as well, and 44 is BURNED. The vc44 debug APK was built while
        // android/app/src/main/assets/public held only 6 files and no index.html: a
        // Dropbox lock made `npx cap sync android` fail with EBUSY, and the documented
        // remedy - retry once - reported "update android in 221ms" while leaving the web
        // assets half-copied. The APK installed fine and then failed to boot with
        // net::ERR_CONNECTION_REFUSED on https://localhost/, because there was nothing to
        // serve. Retrying that sync is NOT sufficient on its own: delete
        // assets/public first, then sync, then check index.html actually exists.
        //
        // It gets its own code rather than reusing 44 because 44 is already installed on
        // the MIUI test device, and that installer silently offers "Open" instead of
        // updating for a same-or-lower code - which would have left the fixed build
        // untested and the old broken one running, the exact trap this comment block has
        // recorded twice before.
        //
        // 46 is 0.53.0: the interstitial A/B experiment (Shape Challenge only, behind its
        // own fail-closed /api/config/ads/interstitial, which is NOT deployed yet) and the
        // fix that makes Android analytics report this package's OWN versionName/
        // versionCode instead of the web bundle's APP_VERSION. 0.53.0 rather than 0.52.x:
        // web already shipped 0.52.0 and 0.52.1 as different code, and analytics now
        // reports the native versionName, so reusing either would merge two different
        // builds into one version row. APP_VERSION stays on the web's own numbering (see
        // the note above). 46 was the first Stage-0 DEBUG apk (Google test units) on the
        // MIUI device.
        //
        // 47 is 0.53.0 again - the Stage-0 fix. On vc46 the 120 s post-Showed safety
        // timeout released gameplay while the ad was still on screen (that WebView never
        // fires visibilitychange under an interstitial), so the next round started behind
        // it. The timeout now frees the ad state and stays on the Result screen. Also:
        // first_open compares Play's installVersion with the native versionName, and
        // Settings shows the native version. A fresh code because 46 is installed on the
        // MIUI device, which silently refuses a same-code update.
        //
        // DEPLOYMENT ORDER, once more: the deployed Worker does not know the four
        // interstitial_* events (a batch simply skips them) nor the config route (404 ->
        // the experiment stays off). Deploy the Worker before this reaches users, or the
        // experiment is invisible and inert.
        //
        // 48 is the 0.53.0 RELEASE CANDIDATE (signed with the upload key, production ad
        // units: rewarded + the new interstitial ca-app-pub-3787018288764544/1587797809).
        // On top of 47 it adds: an earned rewarded bonus can no longer be forfeited by
        // leaving the result screen; Play Together sends its version on create//info//ws,
        // honours the Worker's minimum-version gate (multiplayer_update_required: stop
        // reconnecting, Update button) and the capacity refusal (dedicated message, Create
        // debounce + 15-120 s backoff, no automatic retry); client analytics flush 15 s ->
        // 30 s; Shop events renamed to shop_purchase_with_coins. The interstitial stays OFF
        // until /api/config/ads/interstitial is published. DEPLOY THE WORKER FIRST.
        versionCode 48
        versionName "0.53.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (signingPropertiesFile.exists()) {
                storeFile file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (signingPropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // Google Play Install Referrer. Google's own library, zero transitive dependencies
    // (its POM declares <dependencies/>), and it merges one normal-protection permission
    // into the manifest: com.google.android.finsky.permission.BIND_GET_INSTALL_REFERRER_SERVICE.
    // Read by InstallReferrerPlugin.java only; see INSTALL_REFERRER_NOTES.md.
    implementation "com.android.installreferrer:installreferrer:$installReferrerVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
