apply plugin: 'com.android.application'

// Release signing config - read from a properties file OUTSIDE this project
// entirely (never inside the repo, even gitignored - a project-local file was
// tried first and this workspace's own file-change monitoring surfaced its
// contents unintentionally, so nothing sensitive lives under the project root
// anymore). Never read/logged by this build script beyond the property lookups
// below; Gradle loads the file's actual values directly into memory.
def signingPropertiesFile = new File(System.getProperty("user.home"), "keys/playcydi-signing.properties")
def signingProperties = new Properties()
if (signingPropertiesFile.exists()) {
    signingProperties.load(new FileInputStream(signingPropertiesFile))
}

// Fails fast, with a clear message, only when a release-type task is actually
// being run - evaluated once the full task graph is known, so `assembleDebug`/
// tests/etc. are never affected by this file's absence. A configuration-time
// check inside buildTypes.release{} would fire for every build type, including
// debug, since Gradle configures the whole variant model regardless of which
// task was requested.
gradle.taskGraph.whenReady { taskGraph ->
    def buildingRelease = taskGraph.allTasks.any { it.name.toLowerCase().contains("release") }
    if (!buildingRelease) return

    if (!signingPropertiesFile.exists()) {
        throw new GradleException(
            "Release signing properties not found at ${signingPropertiesFile}. " +
            "Create that file (storeFile, storePassword, keyAlias, keyPassword) before " +
            "building a release APK/AAB - see android/app/build.gradle for the expected keys."
        )
    }
    // Validates presence only - never logs/echoes any value from the file, even
    // the (non-secret) storeFile path, to stay within "never inspect this file".
    ["storeFile", "storePassword", "keyAlias", "keyPassword"].each { key ->
        def value = signingProperties[key]
        if (value == null || value.toString().trim().isEmpty()) {
            throw new GradleException(
                "Release signing properties file at ${signingPropertiesFile} is missing (or has a blank) " +
                "'${key}' value. Required keys: storeFile, storePassword, keyAlias, keyPassword."
            )
        }
    }
    if (!new File(signingProperties['storeFile'].toString()).exists()) {
        throw new GradleException(
            "The keystore file referenced by 'storeFile' in ${signingPropertiesFile} does not exist on disk. " +
            "Double-check the path (forward slashes, even on Windows)."
        )
    }
}

android {
    namespace = "com.playcydi.cydi"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.playcydi.cydi"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionName mirrors APP_VERSION in src/app/constants.ts (the in-app
        // "Version X" string on the Settings screen) - kept in sync by hand so the
        // Play Store listing/device Settings always match what the app itself claims.
        //
        // versionCode must strictly increase on every APK/AAB actually distributed to a
        // device or the Play Store (side-load, internal testing, or production) - Android
        // silently refuses to install an update whose versionCode isn't higher than what's
        // already on the device, and neither the OS nor the installer surfaces an error:
        // MIUI's package installer just showed "Open" for the already-installed version
        // and nothing was overwritten. Reusing the same versionCode across debug builds
        // during development, then forgetting to bump it before the next real distribution,
        // is what caused that.
        // 6 shipped to Play internal testing (release/v6-internal-test); 7 was the
        // local ContentRepository test build; 8 shipped with broken assets
        // (Dropbox EBUSY corrupted that cap sync); 9 = fixed dynamic-content test
        // build; 10 = same build with the WebView DevTools socket enabled
        // (CYDI_TEST_WEBVIEW_DEBUG) so the locked MIUI device can be driven for
        // E2E. All 0.27.2; versionCode bumps only because MIUI silently refuses
        // same-versionCode updates. 7-10 were local/DevTools test builds (never
        // for Play). 11 = first clean production candidate: no DevTools, no API
        // override, signed with the Play keystore, for Closed Testing. 12 = next
        // release candidate, APP_VERSION bumped to 0.28.0 - adds Dark Mode, Rate
        // CYDI (Settings), first-time drawing-controls tutorial, and the Shop pen
        // price UI tweak; no DevTools, signed with the Play keystore. 13 = 0.29.0,
        // the first rewarded-ads-capable build: AD_FLAGS master + rewarded are on and
        // the production rewarded ad unit resolves, but the fail-closed remote kill
        // switch has no published config, so it ships dark. Bumped off 12 rather than
        // reusing it because a signed 0.28.0 AAB with versionCode 12 already exists
        // locally and may already be on Play, which would permanently block re-upload.
        // 13 shipped to Production and the remote switch is now published as
        // { enabled: true }, so rewarded ads are live. 14 = 0.30.0: removes the
        // math-quiz route to the ×2 coin reward from user-facing builds (watching a
        // rewarded ad is now the only way to earn it, and a capped daily chest double is
        // charged only once an ad has actually granted it), plus the matching privacy
        // policy wording. 15 = next Play release: the Android Sharesheet for every
        // share point (@capacitor/share) with generic shares pointing at the Play
        // listing, the website's "Get the Android App" CTA, and the App-vs-web
        // platform split in analytics. NOTE: the MIUI test device now carries a
        // debug-signed verification build at versionCode 16 (used to verify the
        // Sharesheet on real hardware), so a future DEVICE test build needs 17+.
        // Play's highest upload was 14 at that point, so 15 was the next release,
        // shipping as 0.31.0 (the public release before it was 0.30.0 / versionCode
        // 14). 15 then went live on Production on 12 Aug 2026.
        // 17 = 0.33.0, the unified release: rewarded-offer nudges (concrete x2
        // amounts, one-time explainer, 3-skip reminder), the reworked result screen
        // (actions above the comparison canvas, usable during the x2 offer), and
        // Create Challenge discovery. 17 rather than 16 because the MIUI device
        // already carries the debug vc16 noted above - 17 cleared both Play (<=15)
        // and the device in one bump, for the QA build and the AAB alike.
        //
        // 17 = 0.33.0 went LIVE on Google Play Production (released 16 Aug 2026, all
        // 177 countries) - Play's highest upload to date.
        // 18 = 0.34.0: the Android bottom safe-area fix (the navigation bar no longer
        // covers the last button on a screen under edge-to-edge) and the periodic 3x
        // rewarded bonus (every 7th completed round offers ×3 instead of ×2).
        //
        // 18 = 0.34.0, submitted to Play Production on 17 Aug 2026 (full rollout,
        // 177 countries).
        // 19 = 0.34.1, a fixes-only follow-up: touch scrolling on the result screen
        // (the read-only comparison canvas no longer swallows touch gestures) and a
        // short notice while a Play flexible update downloads / is ready to install.
        //
        // 19 = 0.34.1 went LIVE on Google Play (Play's highest upload to date).
        // 20 = 0.35.0, the contextual onboarding release: the "Start here" spotlight
        // replaces the 5-step intro modal, an inline first-round coach (preview
        // countdown, "Draw it", "Tap Done", "Tap Next") replaces the blocking drawing
        // modal, the improvement tip moves below the continue actions, and the result
        // screen is compacted on phones so Next Shape clears the fold. 20 was first
        // used for the debug device-test builds of this same work, which is why the
        // MIUI test device carries a debug-signed 20 - it cannot take this release
        // build over it (same code, and a different signature); wipe the debug build
        // first if that device ever needs the release one.
        //
        //
        // 20 = 0.35.0 went LIVE on Google Play Production on 19 Aug 2026 (full
        // rollout, 177 countries), built from the pre-fix tree.
        // 21 = 0.35.1, a fixes-only follow-up to that release: WCAG AA contrast in
        // the colour tokens, the home screen's Shape Challenge card carrying real
        // shapes, the friend-challenge first-run flow (walkthrough before the
        // preview, longer preview, "Tap Done" coach, Back to home), and the loading
        // state that keeps the onboarding spotlight off a resolving challenge link.
        // 0.35.0 could not carry them: its code was already published, and Play
        // permanently rejects a re-used versionCode.
        //
        // 22: Stage 6 release-candidate TEST build for Play Together, installed
        // on the Mi 8 for real-device QA and never uploaded to Play. It pointed
        // at a temporary staging tunnel via VITE_API_ORIGIN_OVERRIDE, so it must
        // never be confused with a shippable artifact.
        //
        // 23: shipped to Play as 0.38.0 (Play Together). Live.
        //
        // 24: release-candidate TEST build for the next version - the mode
        // selector, 2 Players and Social Points/Rank. DEBUG-signed on purpose:
        // the Mi 8 already carries a debug build, and a release-signed APK over
        // it would be refused for a signature mismatch, which on a test device
        // means uninstalling and losing the very local state (coins, tutorial
        // flags, Social Points) the QA is meant to exercise. Never uploaded to
        // Play; the shipping build takes the next code after it.
        //
        // 24, 25: release candidates for this version, debug-signed and
        // installed only on the Mi 8 for QA. rc1 -> rc2 fixed the compact badge
        // announcing a promotion about 400ms before the progress card did.
        //
        // 26: uploaded to the Play production draft for 0.39.0, then superseded
        // before submission by the multiplayer canvas / leave / resume fixes.
        // A used code can never be re-uploaded, so 27 is what ships.
        //
        // 27: test build with the multiplayer canvas / leave / resume fixes.
        //
        // 28: test build with the coach-mark layout fix for the first-stroke
        // jump.
        //
        // 26: 0.39.0, live since 23 Aug - the mode selector, 2 Players and
        // Social Points/Rank. It went out before the multiplayer drawing fixes
        // were found, which is why those became a patch rather than part of it.
        //
        // 27, 28: debug test builds for that patch; never uploaded.
        //
        // 29: 0.39.1, the patch itself.
        //
        // 30: 0.40.0, the Android visual refresh - Home, Classic Show/Draw,
        // Classic Result, 2 Players Result and Multiplayer Result on one native
        // presentation layer, plus the solid-target-in-preview convention.
        // Play Console bundle explorer on 1 Sep 2026 listed 13 uploads across
        // all tracks (11-15, 17-21, 23, 26, 29); 29 was the highest, so 30 is
        // the next free code.
        //
        // DEPLOYMENT COUPLING: this client reads `gameSerial` from the room
        // snapshot, which only the Worker in this same commit sends. The Worker
        // and the web build must go out together or a rematch stops earning
        // Social Points. See worker/roomDO.ts handleStart.
        versionCode 30
        versionName "0.40.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (signingPropertiesFile.exists()) {
                storeFile file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (signingPropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
